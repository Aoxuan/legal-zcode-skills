# 技能清单(平台无关事实源)
# 安装与配置在 zcode / Cursor / Hermes 三端完全一致,无平台专属步骤。

name: legal-approval-risk
version: "3.1.0"
title: 合同审批风险预审(合同主体一致性校验+回填评级,不一致拒绝退回;低/中/高均附报告,自然人/无企业免查放行;默认扫正式流程,poll --test 扫测试流程)
status: ga
rules_version: legal-draft-2026-08-13

# 入口契约:四个子命令,全部 stdout UTF-8 JSON
entry:
  script: scripts/poll.py
  commands:
    check:
      args: []
      desc: 体检飞书 app 凭证 + 审批定义 + 企查查 + 远程 MySQL + 预审账号
    poll:
      args: ["--test(可选,只扫 FEISHU_APPROVAL_CODES_TEST 测试流程)"]
      desc: 扫描预审账号待办任务,先做合同主体一致性校验(下载合同附件解析签约对方,统一按「签约主体」排除法;不一致 tasks/reject 拒绝退回零计费,无法核验放行提醒人工核对),一致才缓存优先取风险,回填评级(低/中/高均附 Excel 报告到「风险报告附件」控件)并同意放行(幂等,缓存未命中约 7.50 元/家;已预审实例的人工节点待办跳过不代签);实例表单无任何企业控件(如达人解约)免扫描直接放行,回填「无须风险扫描（无合作企业）」,0 元。默认只扫正式码 FEISHU_APPROVAL_CODES;--test 只扫测试码 FEISHU_APPROVAL_CODES_TEST(未配置直接报错,不回退正式码)
    test-instance:
      args: [instance_code]
      desc: 干跑单实例,解析三要素+定位回填控件+取风险,不 approve
    process-instance:
      args: [instance_code]
      desc: 补处理单条:在预审账号待办里找到该实例并 approve 回填(--force 强制重查)

inputs:
  - name: instance_code
    type: string
    required: true
    for: [test-instance, process-instance]
    desc: 飞书审批实例 instance_code

outputs:
  ok: bool
  error: string
  scanned: int
  new: int
  processed: list
  skipped_processed: list
  errors: list
  profile:
    name: string
    credit_code: string
    legal_person: string
    status: string
    three_element_ok: bool|null
    risk_level: enum[low, medium, high, unknown, natural_person, exempt, subject_mismatch, subject_unverified]
    hits: list
    cost: float
    source: string

depends:
  - 飞书自建应用(FEISHU_APP_ID / FEISHU_APP_SECRET):tenant_access_token;需审批读+同意任务(approval:task)权限
  - 合同审批定义(FEISHU_APPROVAL_CODES):一个或多个 approval_code(正式流程,普通 poll 只扫它)
  - 测试流程码(FEISHU_APPROVAL_CODES_TEST,可选):仅 poll --test 扫描;未配置时 --test 直接报错,不回退正式码;两流程控件按名称定位,widget id 不同无影响
  - 审批定义须含「系统风险预审」节点(审批人=预审员工账号,法务节点之前),且【企业风险评级】非必填+可编辑、「附件」控件可编辑
  - 预审审批账号(FEISHU_APPROVER_USER_ID,open_id;未填回退 FEISHU_COMMENT_USER_ID)
  - 表单候选企业控件(FEISHU_FIELD_COMPANY,多个逗号分隔:客户名称,供应商名称,达人企业名称;三者互斥必现其一,三要素从命中的外部选项取出)
  - 回填控件名(FEISHU_FIELD_RATING 默认 企业风险评级;FEISHU_FIELD_ATTACHMENT 当前指向「风险报告附件」专用控件——两控件只保留技能写入内容:低/中/高只放报告(申请人误传文件一并删除),无报告场景误传文件清空,清空被飞书拒绝时降级放行并提醒;控件定位先精确后模糊(控件名须完全包含配置名且配置名>=4字),配稳定前缀即可,括号说明调整不影响)
  - 缓存窗口(FEISHU_CACHE_DAYS 默认 90)
  - 自然人判定:缓存未命中后查 dim_company(表单信用代码为身份证号,或该行 source=自然人信息录入申请表单),是自然人则回填「自然人无须评估风险」,不查企查查不附报告
  - 免扫描直接放行(2026-09-08 口径):实例表单无任何企业控件(如达人解约/达人签约且「是否涉及达人公司」=否,企业控件为条件显示)→不查企查查/不判自然人,回填「无须风险扫描（无合作企业）」(实例与定义表单都定位不到评级控件时仅评论放行),误传过文件仍清空附件控件
  - 企查查客户账号(QCC_APP_KEY / QCC_SECRET_KEY):全部接口(886/2006/856/739/887/888/889)走这一套,单账号口径
  - 合同主体校验(FEISHU_SUBJECT_CHECK 默认开,0=关闭;FEISHU_FIELD_CONTRACT_ATTACH 默认「合同附件」;FEISHU_FIELD_OUR_ENTITY 默认「签约主体」):附件支持 docx/旧版 .doc(UTF-16LE)/文本型 PDF(pdfplumber),扫描件与图片走人工核对兜底;依赖 python-docx>=1.1 与 pdfplumber
  - 远程 MySQL(MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DB):必写 legal_company_query,与 legal-person-poll 共库(dim_company 自然人共表)

reuse:
  - scripts/qcc/  # 与 legal-company-query / 01-poc 同源(风险分级与报告口径一致)
  - scripts/common/  # 同上
  - scripts/feishu/client.py  # 本技能新增待办查询/同意与拒绝任务/控件(先精确后模糊)定位/附件下载
  - scripts/common/contract_subject.py  # 合同主体解析与排除法甄别(2026-10-19 新增,本技能独有)

# 三端安装配置完全一致;定时由宿主 loop/任务计划触发,技能本身是无状态的一趟扫描
packaging: |
  运行时要求本机 Python 3.11,Windows 与 macOS 均可(见 INSTALL.md)。
  安装 = 把本文件夹放入平台 skills 目录(zcode / Cursor / Hermes 相同),
  pip install -r requirements.txt(Windows: py; macOS: python3),复制 .env.example 为 .env 填值即可。
  飞书凭证由每个安装者提供并写入自己的 .env,不要入库。
  长流程用宿主定时调用 poll,技能内用 data/state.json 做实例级幂等。
